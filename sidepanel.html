<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Suite</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: #f5f5f5;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Minimal header - just branding */
    .header {
      background: linear-gradient(135deg, #05A3DD 0%, #74D63C 100%);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
      font-size: 14px;
      font-weight: 600;
    }

    .brand img {
      width: 20px;
      height: 20px;
    }

    .header-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 4px;
      padding: 4px;
      cursor: pointer;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    /* Main content area */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .content iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Setup view */
    .setup-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: white;
    }

    .setup-view h2 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #1f2937;
    }

    .setup-view p {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 16px;
      max-width: 280px;
    }

    .setup-btn {
      background: #05A3DD;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .setup-btn:hover {
      background: #0489BB;
    }

    /* Loading state */
    .loading {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: white;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e5e7eb;
      border-top-color: #05A3DD;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading p {
      margin-top: 12px;
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <img src="icons/icon32.png" alt="">
        <span>Quick Suite</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="refresh-btn" title="Refresh">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M13.65 2.35A8 8 0 1 0 16 8h-2a6 6 0 1 1-1.76-4.24l-2.24.53.47 1.97 4.47-1.06.71-3L14.35 2l-.7.35z"/>
          </svg>
        </button>
        <button class="icon-btn" id="settings-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
            <path d="M13.3 8.7l1.4-.8-.9-1.6-1.4.8a5 5 0 0 0-.9-.5V5h-1.8v1.6a5 5 0 0 0-.9.5l-1.4-.8-.9 1.6 1.4.8a5 5 0 0 0 0 1l-1.4.8.9 1.6 1.4-.8a5 5 0 0 0 .9.5V13h1.8v-1.6a5 5 0 0 0 .9-.5l1.4.8.9-1.6-1.4-.8a5 5 0 0 0 0-1z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="content" id="content">
      <!-- Loading state -->
      <div class="loading" id="loading-view">
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>

      <!-- Setup required state -->
      <div class="setup-view" id="setup-view" hidden>
        <h2>Setup Required</h2>
        <p>Configure your Quick Suite URL in the extension settings to get started.</p>
        <button class="setup-btn" id="open-settings">Open Settings</button>
      </div>

      <!-- Main iframe (hidden until URL is set) -->
      <iframe id="app-frame" hidden></iframe>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
